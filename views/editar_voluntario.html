{% extends "base.html" %}

{% block title %}SISTEMA PULSE | Editar Voluntário{% endblock %}

{% block header_title %}
Editar Voluntário
{% endblock %}

{% block content %}
<div class="w-full max-w-2xl bg-white p-8 rounded-xl shadow-lg border border-gray-100">
    <h2 class="text-2xl font-semibold mb-6 text-indigo-700">{{ voluntario.pessoa.nome }}</h2>

    <form method="POST" class="space-y-6">

        <div class="mb-4">
            <label for="codigo_rfid" class="block mb-2 text-sm font-medium text-gray-900">Código RFID:</label>
            <div class="flex items-stretch gap-2">
                <input type="text" name="codigo_rfid" id="codigo_rfid" value="{{ voluntario.codigo_rfid or '' }}"
                    class="flex-1 bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-orange-500 focus:border-orange-500 p-2.5">

                <button type="button"
                    class="flex items-center gap-2 text-white bg-purple-600 hover:bg-purple-700 focus:ring-4 focus:outline-none focus:ring-purple-300 font-medium rounded-lg text-sm px-4 py-2.5 transition duration-200 min-w-[150px]">
                    <i class="fa-solid fa-wifi"></i> Detectar RFID
                </button>
            </div>
        </div>

        <div class="mb-4">
            <label for="status" class="block mb-2 text-sm font-medium text-gray-900">Status:</label>
            <select name="status" id="status"
                class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-orange-500 focus:border-orange-500 block w-full p-2.5">
                <option value="ativo" {% if voluntario.status=='ativo' %}selected{% endif %}>Ativo</option>
                <option value="inativo" {% if voluntario.status=='inativo' %}selected{% endif %}>Inativo</option>
            </select>
        </div>

        <div class="mb-4">
            <label class="block mb-2 text-sm font-medium text-gray-900">Atividades:</label>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                {% for atividade in atividades_disponiveis %}
                <label class="flex items-center gap-2">
                    <input type="checkbox" name="atividades" value="{{ atividade.id }}" {% if atividade in
                        voluntario.atividades %}checked{% endif %}
                        class="w-4 h-4 text-indigo-600 bg-gray-100 border-gray-300 rounded focus:ring-indigo-500">
                    <span class="text-gray-900">{{ atividade.nome }}</span>
                </label>
                {% endfor %}
            </div>
        </div>

        <div class="flex flex-col md:flex-row gap-4 mt-6">
            <button type="submit"
                class="w-full md:w-auto text-white bg-orange-500 hover:bg-orange-600 focus:ring-4 focus:outline-none focus:ring-orange-300 font-medium rounded-lg text-sm px-5 py-2.5 transition duration-200">
                Atualizar Voluntário
            </button>
            <a href="{{ url_for('voluntarios.voluntarios') }}"
                class="w-full md:w-auto text-gray-700 bg-white hover:bg-gray-100 border border-gray-300 focus:ring-4 focus:outline-none focus:ring-gray-200 font-medium rounded-lg text-sm px-5 py-2.5 text-center transition duration-200">
                Cancelar
            </a>
        </div>

    </form>
</div>
{% endblock %}
