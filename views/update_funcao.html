{% extends "base.html" %}

{% block title %}SISTEMA PULSE | Funções{% endblock %}

{% block header_title %}
Editar Função
{% endblock %}

{% block content %}
    <form action="/update_funcao" method="post">
        <input type="hidden" name="id" value="{{ funcao.id }}">

        <label for="nome">Nome da Função:</label><br>
        <input type="text" name="nome" id="nome" value="{{ funcao.nome }}" required>
        <br><br>

        <label for="descricao">Descrição:</label><br>
        <textarea name="descricao" id="descricao" rows="4" cols="50">{{ funcao.descricao }}</textarea>
        <br><br>

        <label for="custo_hora">Custo por Hora:</label><br>
        <input type="number" step="0.01" name="custo_hora" id="custo_hora" value="{{ funcao.custo_hora }}">
        <br><br>

        <input type="submit" value="Atualizar Função">
    </form>
{% endblock %}
