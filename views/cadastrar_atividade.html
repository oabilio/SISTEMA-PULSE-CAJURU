{% extends "base.html" %}

{% block title %}SISTEMA PULSE | Atividades{% endblock %}

{% block header_title %}
Cadastrar Atividade
{% endblock %}

{% block content %}
    <form action="/add_atividade" method="post">
        <label for="nome">Nome da Atividade:</label><br>
        <input type="text" name="nome" id="nome" required>
        <br><br>

        <label for="descricao">Descrição:</label><br>
        <textarea name="descricao" id="descricao" rows="4" cols="50"></textarea>
        <br><br>

        <label for="custo_hora">Custo por Hora:</label><br>
        <input type="number" step="0.01" name="custo_hora" id="custo_hora" value="0.0">
        <br><br>

        <input type="submit" value="Cadastrar Atividade">
    </form>
{% endblock %}
