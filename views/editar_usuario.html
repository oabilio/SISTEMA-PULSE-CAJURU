{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h2>Editar Usuário</h2>

  <form method="POST">
    <div class="mb-3">
      <label>Nome:</label>
      <input type="text" class="form-control" value="{{ usuario.pessoa.nome }}" readonly>
    </div>

    <div class="mb-3">
      <label>Login:</label>
      <input type="text" class="form-control" name="login" value="{{ usuario.login }}" required>
    </div>

    <div class="mb-3">
      <label>Nova Senha (opcional):</label>
      <input type="password" class="form-control" name="senha" placeholder="Digite nova senha se quiser alterar">
    </div>

    <div class="mb-3">
      <label>Função:</label>
      <select class="form-select" name="role_id" required>
        {% for role in roles %}
        <option value="{{ role.id }}" {% if role.id == usuario.role_id %}selected{% endif %}>{{ role.name }}</option>
        {% endfor %}
      </select>
    </div>

    <button type="submit" class="btn btn-primary">Salvar Alterações</button>
    <a href="{{ url_for('usuarios_bp.usuarios') }}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
