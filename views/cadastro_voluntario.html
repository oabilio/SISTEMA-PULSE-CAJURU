{% extends "base.html" %}

{% block title %}SISTEMA PULSE | Voluntários{% endblock %}

{% block header_title %}
Cadastrar Voluntário
{% endblock %}

{% block content %}
<div class="w-full max-w-2xl bg-white p-8 rounded-xl shadow-lg border border-gray-100">
    <form action="{{ url_for('voluntarios.cadastrar_voluntario') }}" method="post">

        <div class="mb-4">
            <label for="pessoa" class="block mb-2 text-sm font-medium text-gray-900">Selecione a Pessoa:</label>
            <select name="pessoa_id" id="pessoa" required
                class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-orange-500 focus:border-orange-500 block w-full p-2.5">
                <option value="">-- Selecione --</option>
                {% for pessoa in pessoas %}
                <option value="{{ pessoa.id }}">{{ pessoa.nome }} - {{ pessoa.email }}</option>
                {% endfor %}
            </select>
            <a href="{{ url_for('pessoas.cadastrar_pessoa', next=request.path) }}"
                class="inline-block mt-2 text-sm text-blue-600 hover:underline">
                Criar nova pessoa
            </a>
        </div>

        <div class="mb-4">
            <label for="codigo_rfid" class="block mb-2 text-sm font-medium text-gray-900">
                Código RFID (opcional):
            </label>
            <div class="flex items-stretch gap-2">
                <input type="text" name="codigo_rfid" id="codigo_rfid" placeholder="Digite o código RFID"
                    class="flex-1 bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-orange-500 focus:border-orange-500 p-2.5">

                <button type="button"
                    class="flex items-center gap-2 text-white bg-purple-600 hover:bg-purple-700 focus:ring-4 focus:outline-none focus:ring-purple-300 font-medium rounded-lg text-sm px-4 py-2.5 transition duration-200 min-w-[150px]">
                    <i class="fa-solid fa-wifi"></i> Detectar RFID
                </button>
            </div>
        </div>

        <div class="flex items-center space-x-4 mt-6">
            <button type="submit"
                class="w-full text-white bg-orange-500 hover:bg-orange-600 focus:ring-4 focus:outline-none focus:ring-orange-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center transition duration-200">
                Cadastrar Voluntário
            </button>
            <a href="{{ url_for('voluntarios.voluntarios') }}"
                class="w-full text-gray-700 bg-white hover:bg-gray-100 border border-gray-300 focus:ring-4 focus:outline-none focus:ring-gray-200 font-medium rounded-lg text-sm px-5 py-2.5 text-center transition duration-200">
                Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
