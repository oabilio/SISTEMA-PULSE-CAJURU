{% extends "base.html" %}

{% block title %}SISTEMA PULSE | Voluntários{% endblock %}

{% block header_title %}
Cadastrar Voluntário
Cadastrar Voluntário
{% endblock %}

{% block content %}
<form action="/cadastrar_voluntario" method="post">
    <label for="pessoa">Selecione a Pessoa:</label><br>
    <select name="pessoa_id" id="pessoa" required>
        <option value="">-- Selecione --</option>
        {% for pessoa in pessoas %}
        <option value="{{ pessoa.id }}">{{ pessoa.nome }} - {{ pessoa.email }}</option>
        {% endfor %}
    </select>
    <a href="{{ url_for('pessoas.cadastrar_pessoa', next=request.path) }}" class="btn btn-secondary btn-sm">Criar nova
        pessoa</a>
    <br><br>

    <input type="submit" value="Cadastrar">
</form>
{% endblock %}
