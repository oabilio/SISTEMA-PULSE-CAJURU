<html>

<head>

    <title>SISTEMA PULSE | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            font-weight: 400;
        }
    </style>
</head>

<body class="bg-gray-50">
    <section class="bg-gray-50">
        <div class="flex flex-col items-center justify-center px-6 py-8 mx-auto md:h-screen lg:py-0">
            <a href="#" class="flex flex-col items-center mb-6 text-2xl font-semibold text-gray-900">
                <img class="h-20 mb-2" src="../static/img/logo2.png" alt="Logo Pulse">
            </a>

            <div class="w-full bg-white rounded-lg shadow border md:mt-0 sm:max-w-md xl:p-0 border-gray-200">
                <div class="p-6 space-y-6 sm:p-8">
                    <h1 class="text-xl font-bold leading-tight tracking-tight text-gray-900 md:text-2xl">
                        Login
                    </h1>

                    {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                    <div class="mb-4">
                        {% for category, message in messages %}
                        <div class="flash-message p-3 text-sm rounded-md transition duration-300 
        {% if category == 'error' %}bg-red-100 text-red-700 border border-red-300
        {% elif category == 'success' %}bg-green-100 text-green-700 border border-green-300
        {% else %}bg-blue-100 text-blue-700 border border-blue-300{% endif %}">
                            {{ message }}
                        </div>
                        {% endfor %}
                    </div>
                    {% endif %}
                    {% endwith %}

                    <form class="space-y-6" action="{{ url_for('login.validated_user') }}" method="POST">
                        <div>
                            <label for="login" class="block mb-2 text-sm font-medium text-gray-900">Usuário</label>
                            <input type="text" name="login" id="login" placeholder="Digite seu usuário" required
                                class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-orange-500 focus:border-orange-500 block w-full p-2.5">
                        </div>

                        <div>
                            <label for="password" class="block mb-2 text-sm font-medium text-gray-900">Senha</label>
                            <input type="password" name="password" id="password" placeholder="Digite sua senha" required
                                class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-orange-500 focus:border-orange-500 block w-full p-2.5">
                        </div>

                        <button type="submit"
                            class="w-full text-white bg-orange-500 hover:bg-orange-600 focus:ring-4 focus:outline-none focus:ring-orange-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center transition duration-200">
                            Entrar
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </section>
    <script>
        setTimeout(() => {
            const flashMessages = document.querySelectorAll('.flash-message');
            flashMessages.forEach(msg => {
                msg.classList.add('opacity-0', 'transition-opacity', 'duration-500');
                setTimeout(() => msg.remove(), 500);
            });
        }, 5000);
    </script>
</body>

</html>
