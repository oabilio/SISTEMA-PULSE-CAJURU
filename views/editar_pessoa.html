{% extends "base.html" %}

{% block title %}SISTEMA PULSE | Editar Pessoa{% endblock %}

{% block header_title %}
Editar Pessoa
{% endblock %}

{% block content %}
<div class="w-full max-w-2xl bg-white p-8 rounded-xl shadow-lg border border-gray-100">
    <h2 class="text-2xl font-semibold mb-6 text-indigo-700">{{ pessoa.nome }}</h2>

    <form method="POST" action="{{ url_for('pessoas_bp.update_pessoa') }}" class="space-y-6">
        <input type="hidden" name="id" value="{{ pessoa.id }}">

        <!-- Nome -->
        <div>
            <label class="block mb-2 text-sm font-medium text-gray-900">Nome:</label>
            <input type="text" name="name" value="{{ pessoa.nome }}" required
                   class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg block w-full p-2.5">
        </div>

        <!-- CPF -->
        <div>
            <label class="block mb-2 text-sm font-medium text-gray-900">CPF:</label>
            <input type="text" name="cpf" value="{{ pessoa.cpf or '' }}"
                   class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg block w-full p-2.5">
        </div>

        <!-- Telefone -->
        <div>
            <label class="block mb-2 text-sm font-medium text-gray-900">Telefone:</label>
            <input type="text" name="telefone" value="{{ pessoa.telefone or '' }}"
                   class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg block w-full p-2.5">
        </div>

        <!-- Email -->
        <div>
            <label class="block mb-2 text-sm font-medium text-gray-900">Email:</label>
            <input type="email" name="email" value="{{ pessoa.email }}" required
                   class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg block w-full p-2.5">
        </div>

        <!-- Data de Nascimento -->
        <div>
            <label class="block mb-2 text-sm font-medium text-gray-900">Data de Nascimento:</label>
            <input type="date" name="data_nasc" value="{{ pessoa.data_nasc.strftime('%Y-%m-%d') if pessoa.data_nasc else '' }}"
                   class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg block w-full p-2.5">
        </div>

        <!-- Botões -->
        <div class="flex flex-col md:flex-row gap-4 mt-6">
            <button type="submit"
                    class="w-full md:w-auto text-white bg-orange-500 hover:bg-orange-600 focus:ring-4 focus:outline-none focus:ring-orange-300 font-medium rounded-lg text-sm px-5 py-2.5 transition duration-200">
                Salvar Alterações
            </button>
            <a href="{{ url_for('pessoas_bp.pessoas') }}"
               class="w-full md:w-auto text-gray-700 bg-white hover:bg-gray-100 border border-gray-300 focus:ring-4 focus:outline-none focus:ring-gray-200 font-medium rounded-lg text-sm px-5 py-2.5 text-center transition duration-200">
                Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
